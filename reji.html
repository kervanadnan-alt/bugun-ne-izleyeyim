<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reji Masası | Bugün Ne İzlesem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: #151c2e;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2.5rem 1rem;
    }
    .wrapper { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { color: var(--muted); margin-bottom: 2rem; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 1rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; }
    .badge {
      display: inline-block;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .st-posted { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .st-queue { background: rgba(234, 179, 8, 0.2); color: #facc15; }
    .btn-back {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      display: inline-block;
      margin-bottom: 1.5rem;
    }
    .btn-back:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="wrapper">
    <a href="index.html" class="btn-back">&larr; Vitrine Dön</a>
    <h1>🎬 Reji Masası</h1>
    <p>19:45 Paylaşım Kuyruğu ve Film Yönetimi</p>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>Film Başlığı</th>
            <th>IMDb</th>
            <th>Platform</th>
            <th>Durum</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function init() {
      try {
        let res = await fetch('data/recommendations.json');
        if (!res.ok) res = await fetch('recommendations.json');
        const list = await res.json();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        list.forEach(m => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${m.title}</strong> (${m.year || ''})</td>
            <td>★ ${m.imdb}</td>
            <td>${m.platform || '-'}</td>
            <td><span class="badge ${m.posted ? 'st-posted' : 'st-queue'}">${m.posted ? 'Paylaşıldı' : 'Sırada'}</span></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (e) {
        console.error(e);
      }
    }
    init();
  </script>
</body>
</html>
