<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reji Masası | Film Yönetimi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: #161c2d;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #2563eb;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
    }
    .wrapper { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    p { color: var(--muted); margin-bottom: 2rem; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.85rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .status-posted { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .status-queue { background: rgba(234, 179, 8, 0.2); color: #facc15; }
    .btn-back {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      display: inline-block;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <a href="index.html" class="btn-back">← Siteye Dön</a>
    <h1>🎬 Reji Masası</h1>
    <p>19:45 Paylaşım Kuyruğu ve recommendations.json Listesi</p>

    <div class="panel">
      <table id="movieTable">
        <thead>
          <tr>
            <th>Film</th>
            <th>IMDb</th>
            <th>Platform</th>
            <th>Durum</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dinamik -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function load() {
      try {
        const res = await fetch('data/recommendations.json');
        const list = await res.json();
        const tbody = document.querySelector('#movieTable tbody');
        tbody.innerHTML = '';
        list.forEach(m => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${m.title}</strong> (${m.year || ''})</td>
            <td>★ ${m.imdb}</td>
            <td>${m.platform || '-'}</td>
            <td><span class="status-badge ${m.posted ? 'status-posted' : 'status-queue'}">${m.posted ? 'Paylaşıldı' : 'Sırada'}</span></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (e) {
        console.error(e);
      }
    }
    load();
  </script>
</body>
</html>
