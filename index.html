<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akşam Matinesi | Çoklu Platform Film & Dizi Keşif Vitrini</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            netflix: {
              red: '#E50914',
              hover: '#B81D24',
              dark: '#08080a',
              surface: '#121216',
              card: '#18181f',
              border: '#272732'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #08080a;
      color: #f4f4f5;
      font-family: 'Inter', sans-serif;
    }
    .glass {
      background: rgba(18, 18, 24, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0d0d12;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #2a2a35;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-netflix-red selection:text-white">

  <!-- ÜST MENÜ / HEADER -->
  <header class="border-b border-neutral-800 bg-neutral-950/90 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-netflix-red to-red-800 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-red-600/30">
          M
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-lg text-white">Akşam Matinesi</span>
            <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full bg-netflix-red/20 text-red-400 border border-red-500/30">Vitrin</span>
          </div>
          <p class="text-[11px] text-neutral-400">Çoklu Platform Canlı Sinema & Dizi Rehberi</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <a href="./reji.html" class="px-3.5 py-2 rounded-xl bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-xs sm:text-sm font-bold text-red-400 hover:text-red-300 transition-all flex items-center gap-1.5 shadow-sm">
          <span>🎬 Reji Masası</span>
        </a>
      </div>
    </div>
  </header>

  <!-- ANA İÇERİK -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    
    <!-- Filtre Çubuğu -->
    <div class="glass p-5 rounded-3xl space-y-4 shadow-xl">
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
        <div>
          <label class="text-[10px] font-bold uppercase text-red-400 block mb-1">🍿 Platform Seçin</label>
          <select id="filter-platform" class="w-full bg-neutral-900 border border-neutral-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-netflix-red" onchange="fetchCatalog(1)">
            <option value="all">🌐 Tüm Platformlar</option>
            <option value="8" selected>Netflix</option>
            <option value="119">Prime Video</option>
            <option value="11">MUBI</option>
            <option value="344">BluTV</option>
            <option value="337">Disney+</option>
          </select>
        </div>

        <div>
          <label class="text-[10px] font-bold uppercase text-sky-400 block mb-1">🌍 Ülke Sineması</label>
          <select id="filter-country" class="w-full bg-neutral-900 border border-neutral-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-netflix-red" onchange="fetchCatalog(1)">
            <option value="all" selected>Tüm Dünya</option>
            <option value="TR">🇹🇷 Yerli / Türk</option>
            <option value="nordic">❄️ İskandinav</option>
            <option value="europe">🇪🇺 Avrupa</option>
            <option value="KR">🇰🇷 Kore</option>
            <option value="US">🇺🇸 Hollywood</option>
          </select>
        </div>

        <div>
          <label class="text-[10px] font-bold uppercase text-emerald-400 block mb-1">⏱️ Tür / Format</label>
          <select id="filter-media" class="w-full bg-neutral-900 border border-neutral-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-netflix-red" onchange="fetchCatalog(1)">
            <option value="movie" selected>🎥 Yalnızca Film</option>
            <option value="tv">📺 Yalnızca Dizi</option>
          </select>
        </div>

        <div>
          <label class="text-[10px] font-bold uppercase text-amber-400 block mb-1">🔥 Sıralama</label>
          <select id="filter-sort" class="w-full bg-neutral-900 border border-neutral-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-netflix-red" onchange="fetchCatalog(1)">
            <option value="popularity.desc" selected>En Popüler</option>
            <option value="vote_count.desc">👑 Kült / Hayran Kitlesi</option>
            <option value="vote_average.desc">⭐ En Yüksek Puanlı</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Film Vitrini Grid -->
    <div class="space-y-4">
      <div class="flex items-center justify-between text-xs text-neutral-400">
        <span id="catalog-count" class="font-bold text-neutral-300">Yapımlar taranıyor...</span>
        <span>Detay & Doğrudan İzle için afişe tıklayın</span>
      </div>

      <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>

      <div class="text-center pt-4">
        <button id="btn-load-more" onclick="loadMore()" class="hidden px-6 py-2.5 rounded-xl bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-xs font-bold text-neutral-200">
          Daha Fazla Yapım Göster ↓
        </button>
      </div>
    </div>
  </main>

  <!-- FİLM DETAY & DOĞRUDAN İZLE MODAL PENCERESİ -->
  <div id="movie-modal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 backdrop-blur-xl hidden">
    <div class="max-w-2xl w-full glass rounded-3xl border border-neutral-800 p-6 sm:p-8 space-y-6 relative overflow-hidden shadow-2xl">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-neutral-400 hover:text-white text-xl p-2">✕</button>

      <div class="flex flex-col sm:flex-row gap-6 items-start">
        <img id="modal-poster" src="" class="w-36 sm:w-44 h-52 sm:h-64 object-cover rounded-2xl border border-neutral-700 shadow-xl shrink-0 mx-auto sm:mx-0">
        
        <div class="space-y-3 flex-1">
          <div class="flex flex-wrap items-center gap-2">
            <span id="modal-vote" class="px-2.5 py-0.5 rounded-full bg-amber-400/10 text-amber-400 text-xs font-bold border border-amber-400/30">★ --</span>
            <span id="modal-year" class="px-2.5 py-0.5 rounded-full bg-neutral-900 text-neutral-300 text-xs font-bold border border-neutral-800">📅 --</span>
            <span id="modal-platform-badge" class="px-2.5 py-0.5 rounded-full bg-neutral-900 text-red-400 text-xs font-bold border border-neutral-800">🍿 Platform</span>
          </div>

          <h3 id="modal-title" class="text-xl sm:text-2xl font-black text-white">Film Adı</h3>
          <p id="modal-overview" class="text-xs sm:text-sm text-neutral-300 leading-relaxed max-h-36 overflow-y-auto custom-scrollbar pr-1"></p>
          
          <!-- DOĞRUDAN RESMİ İZLEME BAĞLANTISI BUTONU -->
          <div id="modal-watch-container" class="pt-2"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TMDB_API_KEY = "65a75854bdb8832f10fc1687f4b299d5";
    const BASE_URL = "https://api.themoviedb.org/3";
    const IMG_BASE = "https://image.tmdb.org/t/p";
    const TODAY_ISO = new Date().toISOString().split('T')[0];

    const PLATFORM_MAP = {
      '8': 'Netflix',
      '119': 'Prime Video',
      '11': 'MUBI',
      '344': 'BluTV',
      '337': 'Disney+'
    };

    let currentPage = 1;
    let catalogItems = [];

    // DOĞRUDAN PLATFORMA GÖTÜREN RESMİ ARAMA / İZLEME FONKSİYONU
    function getPlatformWatchTarget(title, platformCode) {
      const q = encodeURIComponent(title);
      const plat = PLATFORM_MAP[platformCode] || 'Netflix';

      if (platformCode === '119' || plat.includes('Prime')) {
        return {
          url: `https://www.primevideo.com/search/ref=atv_nb_sr?phrase=${q}`,
          label: "▶️ Prime Video'da İzle",
          style: "bg-sky-600 hover:bg-sky-500 text-white"
        };
      }
      if (platformCode === '11' || plat.includes('MUBI')) {
        return {
          url: `https://mubi.com/tr/search/films?query=${q}`,
          label: "▶️ MUBI'de İzle",
          style: "bg-amber-600 hover:bg-amber-500 text-white"
        };
      }
      if (platformCode === '344' || plat.includes('BluTV')) {
        return {
          url: `https://www.blutv.com/ara?q=${q}`,
          label: "▶️ BluTV'de İzle",
          style: "bg-cyan-600 hover:bg-cyan-500 text-white"
        };
      }
      if (platformCode === '337' || plat.includes('Disney')) {
        return {
          url: `https://www.disneyplus.com/search?q=${q}`,
          label: "▶️ Disney+'ta İzle",
          style: "bg-blue-700 hover:bg-blue-600 text-white"
        };
      }
      // Varsayılan: Doğrudan Netflix arama ekranı:
      return {
        url: `https://www.netflix.com/search?q=${q}`,
        label: "▶️ Netflix'te İzle",
        style: "bg-netflix-red hover:bg-netflix-hover text-white"
      };
    }

    async function fetchCatalog(page = 1, append = false) {
      const pChoice = document.getElementById('filter-platform').value;
      const cChoice = document.getElementById('filter-country').value;
      const mChoice = document.getElementById('filter-media').value;
      const sChoice = document.getElementById('filter-sort').value;
      const countEl = document.getElementById('catalog-count');

      let url = `${BASE_URL}/discover/${mChoice}?api_key=${TMDB_API_KEY}&language=tr-TR&sort_by=${sChoice}&page=${page}&include_adult=false&vote_count.gte=30`;

      if (pChoice !== 'all') {
        url += `&watch_region=TR&with_watch_providers=${pChoice}&with_watch_monetization_types=flatrate`;
      }

      if (cChoice === 'TR') url += `&with_original_language=tr`;
      else if (cChoice === 'nordic') url += `&with_original_language=da|sv|no|is`;
      else if (cChoice === 'europe') url += `&with_origin_country=FR|DE|IT|ES|GB`;
      else if (cChoice !== 'all') url += `&with_origin_country=${cChoice}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const valid = (data.results || []).filter(x => x.poster_path && (x.title || x.name));

        if (append) {
          catalogItems = [...catalogItems, ...valid];
        } else {
          catalogItems = valid;
        }

        renderGrid(catalogItems);
        countEl.textContent = `${catalogItems.length} yapım listelendi`;

        const btnMore = document.getElementById('btn-load-more');
        if (data.page < data.total_pages) {
          btnMore.classList.remove('hidden');
          currentPage = data.page;
        } else {
          btnMore.classList.add('hidden');
        }
      } catch (e) {
        console.error('Katalog çekilemedi:', e);
      }
    }

    function renderGrid(items) {
      const grid = document.getElementById('movie-grid');
      grid.innerHTML = '';

      items.forEach(m => {
        const title = m.title || m.name;
        const date = m.release_date || m.first_air_date || '';
        const year = date ? date.split('-')[0] : '';
        const vote = m.vote_average ? m.vote_average.toFixed(1) : 'NR';
        const poster = `${IMG_BASE}/w500${m.poster_path}`;

        const card = document.createElement('div');
        card.className = "glass rounded-2xl p-2.5 cursor-pointer hover:border-netflix-red transition-all group flex flex-col";
        card.onclick = () => openModal(m);

        card.innerHTML = `
          <div class="relative overflow-hidden rounded-xl mb-2 aspect-[2/3] bg-neutral-900">
            <img src="${poster}" class="w-full h-full object-cover group-hover:scale-105 transition-all duration-300">
            <span class="absolute top-2 right-2 px-2 py-0.5 rounded-md bg-black/80 text-amber-400 text-[10px] font-black border border-amber-500/30">★ ${vote}</span>
          </div>
          <h4 class="text-xs font-bold text-white truncate">${title}</h4>
          <span class="text-[10px] text-neutral-400 mt-0.5">${year}</span>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(m) {
      const pChoice = document.getElementById('filter-platform').value;
      const title = m.title || m.name;
      const target = getPlatformWatchTarget(title, pChoice);

      document.getElementById('modal-poster').src = `${IMG_BASE}/w780${m.poster_path}`;
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-overview').textContent = m.overview || 'Konu bilgisi bulunmuyor.';
      document.getElementById('modal-vote').textContent = `★ ${m.vote_average ? m.vote_average.toFixed(1) : 'NR'}`;
      document.getElementById('modal-year').textContent = `📅 ${(m.release_date || m.first_air_date || '').split('-')[0] || '--'}`;
      document.getElementById('modal-platform-badge').textContent = `🍿 ${PLATFORM_MAP[pChoice] || 'Platform'}`;

      // Doğrudan resmi siteyi açan buton:
      document.getElementById('modal-watch-container').innerHTML = `
        <a href="${target.url}" target="_blank" rel="noopener noreferrer" class="w-full py-3 px-5 rounded-xl font-bold text-xs sm:text-sm transition-all flex items-center justify-center gap-2 shadow-lg active:scale-95 ${target.style}">
          <span>${target.label}</span>
          <span>↗</span>
        </a>
      `;

      document.getElementById('movie-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('movie-modal').classList.add('hidden');
    }

    function loadMore() {
      fetchCatalog(currentPage + 1, true);
    }

    // Başlangıç yüklemesi:
    fetchCatalog(1);
  </script>
</body>
</html>
