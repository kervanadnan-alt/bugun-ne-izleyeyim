name: Günlük Netflix Tweeti & Site Güncellemesi

on:
  schedule:
    # Her gün Türkiye Saati ile 19:30'da çalışır (16:30 UTC)
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  run-daily-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu Çalıştır (X'e Tweet At ve JSON'u Güncelle)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python bot.py

      - name: Değişen JSON Dosyasını Repoya Kaydet (Otomatik Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/recommendations.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Günlük Netflix önerisi eklendi [skip ci]" && git push)
